<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Congregación App</title>
  
  <!-- Font Awesome para Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Estilos Propios -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- PWA Manifest & Theme Color -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="app-container">
    
    <!-- Pantalla de Login -->
    <div id="login-view" class="view active">
      <div class="login-logo"><i class="fa-solid fa-place-of-worship"></i></div>
      <h1 class="login-title">Congregación App</h1>
      <form id="login-form">
        <div class="input-group">
          <label for="login-email">Correo Electrónico</label>
          <input type="email" id="login-email" required placeholder="tu@correo.com">
        </div>
        <div class="input-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" id="btn-login">Ingresar</button>
        <p id="login-error" style="color: var(--danger); font-size: 0.85rem; margin-top: 10px; text-align: center; display: none;"></p>
      </form>
    </div>

    <!-- UI de la App (Oculta hasta login) -->
    <div id="app-ui" class="app-ui">
      
      <!-- Header -->
      <header>
        <div class="header-title" id="header-title">Inicio</div>
        <div class="sync-status" id="sync-status" title="Estado de Sincronización"></div>
      </header>

      <!-- Main Content / Vistas -->
      <main id="main-content">
        
        <!-- Tab: Inicio -->
        <div id="view-inicio" class="view active">
          <h2>Resumen de la Semana</h2>
          <div class="card" id="inicio-resumen">
            <p>Cargando información...</p>
          </div>
          
          <h2>Tablero de Anuncios</h2>
          <div id="inicio-anuncios">
            <!-- Anuncios dinámicos -->
          </div>
        </div>

        <!-- Tab: Reuniones -->
        <div id="view-reuniones" class="view">
          <div class="week-nav" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <button class="btn btn-secondary" style="width: auto; padding: 8px 12px;" id="btn-prev-week"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="current-week-label" style="font-weight: 600;">Semana Actual</span>
            <button class="btn btn-secondary" style="width: auto; padding: 8px 12px;" id="btn-next-week"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          
          <div class="card">
            <h3>Vida y Ministerio</h3>
            <div id="reunion-entre-semana"></div>
          </div>
          
          <div class="card">
            <h3>Fin de Semana</h3>
            <div id="reunion-fin-semana"></div>
          </div>
        </div>

        <!-- Tab: Predicación -->
        <div id="view-predicacion" class="view">
          <!-- TODO: Subtabs for Mi Actividad, Territorios, etc. -->
          <h2>Mi Actividad</h2>
          <div class="card">
            <p>Horas este mes: <strong id="actividad-horas-mes">0</strong></p>
            <p>Año de Servicio: <strong id="actividad-horas-ano">0</strong></p>
          </div>
          <button class="btn btn-primary" style="margin-bottom: 16px;">Enviar Informe</button>
        </div>

        <!-- Tab: Asignaciones -->
        <div id="view-asignaciones" class="view">
          <h2>Mis Asignaciones</h2>
          <div id="mis-asignaciones-list"></div>
        </div>

        <!-- Tab: Eventos -->
        <div id="view-eventos" class="view">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2>Eventos</h2>
            <button class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.85rem;" id="btn-add-evento"><i class="fa-solid fa-plus"></i></button>
          </div>
          <div id="eventos-list"></div>
        </div>

        <!-- Tab: Perfil -->
        <div id="view-perfil" class="view">
          <div class="card" style="text-align: center;">
            <div style="width: 60px; height: 60px; background: var(--accent-primary); border-radius: 50%; margin: 0 auto 10px auto; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; color: white;" id="perfil-avatar">?</div>
            <h3 id="perfil-nombre">Cargando...</h3>
            <p id="perfil-rol" style="margin-bottom: 10px;">Cargando...</p>
            <button class="btn btn-secondary" id="btn-logout" style="margin-top: 10px;">Cerrar Sesión</button>
          </div>
        </div>

      </main>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <a href="#" class="nav-item active" data-target="view-inicio">
          <i class="fa-solid fa-house"></i>
          <span>Inicio</span>
        </a>
        <a href="#" class="nav-item" data-target="view-reuniones">
          <i class="fa-solid fa-book-open"></i>
          <span>Reuniones</span>
        </a>
        <a href="#" class="nav-item" data-target="view-predicacion">
          <i class="fa-solid fa-map-location-dot"></i>
          <span>Predic.</span>
        </a>
        <a href="#" class="nav-item" data-target="view-asignaciones">
          <i class="fa-solid fa-clipboard-list"></i>
          <span>Asign.</span>
        </a>
        <a href="#" class="nav-item" data-target="view-eventos">
          <i class="fa-solid fa-calendar-days"></i>
          <span>Eventos</span>
        </a>
        <a href="#" class="nav-item" data-target="view-perfil">
          <i class="fa-solid fa-user"></i>
          <span>Perfil</span>
        </a>
      </nav>

    </div> <!-- app-ui -->

    <!-- Global Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay"></div>

    <!-- Generic Bottom Sheet -->
    <div class="bottom-sheet" id="bottom-sheet">
      <div class="sheet-handle"></div>
      <div id="sheet-content"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
